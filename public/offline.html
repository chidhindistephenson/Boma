<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Boma offline</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f4f1ea;
                color: #101010;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    background: #050505;
                    color: #f7f3ea;
                }
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
            }

            main {
                width: min(460px, 100%);
                border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
                border-radius: 32px;
                padding: 32px;
                box-shadow: 0 28px 90px rgba(0, 0, 0, .16);
            }

            p {
                line-height: 1.6;
            }

            button {
                border: 0;
                border-radius: 999px;
                background: currentColor;
                color: Canvas;
                padding: 12px 18px;
                font-weight: 800;
                letter-spacing: .08em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <main>
            <p style="letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:800;">Boma offline</p>
            <h1>You are offline.</h1>
            <p>Previously opened pages may still work. New actions are saved where possible and retried when your connection returns.</p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
